<!doctype html><html lang=en><meta charset=UTF-8><meta content="width=device-width,initial-scale=1.0,viewport-fit=cover" name=viewport><meta content=#2dd4bf name=theme-color><meta data-rh=true name=darkreader-lock><meta content=summary_large_image data-rh=true name=twitter:card><meta content="Projekt J.E.N.O.V.A" property=og:site_name><meta content="Jenova Package Database Editor | WebApp" property=og:title><meta content="Create, Edit, organize and maintain Jenova package databases directly in your browser." property=og:description><meta content=website property=og:type><meta content=https://jenova-framework.github.io/tools/PkgDBE property=og:url><meta content=https://jenova-framework.github.io/tools/PkgDBE/data/og-image.jpg property=og:image><meta content="A Web-based editor for creating, editing, managing Jenova Framework package databases." name=description><meta content="Jenova, Jenova Framework, Godot Engine, Godot, C++, Jenova Runtime, Jenova Package" name=keywords><title>Jenova Package Database Editor | Web v1.2</title><link href=data/icon.svg rel=icon type=image/svg+xml><link href=data/style.css rel=stylesheet><link href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css rel=stylesheet><body><header class=header><div class=header-left><div id=project_logo><img alt=Logo draggable=false src=data/logo.png></div><div id=project_title><div id=project_name>Jenova Package Database Editor</div><div id=project_brief>Developed by Hamid.Memar (MemarDesign™ LLC.)</div></div></div><div class=header-actions><button class="btn btn-primary" onclick=loadDatabase()><i class="fas fa-folder-open"></i> Load Package Database</button><button class="btn btn-success" onclick=fetchDatabase()><i class="fas fa-globe"></i> Fetch Package Database</button><button class=btn onclick=saveDatabase()><i class="fas fa-save"></i> Save Package Database</button></div></header><div class=main-container><aside class=sidebar><div class=sidebar-header>Categories</div><div class=category-list id=categoryList></div><div class=sidebar-footer><span id=packageCount>0 packages</span></div></aside><main class=content><div class=package-list-area><div class=list-header><div><h2 id=categoryTitle>All Packages</h2><span class=count id=packageCountDisplay>0 packages</span></div><div class=list-actions><div class=search-wrapper><i class="fas fa-search"></i><input placeholder="Search packages..." id=searchInput oninput=filterPackages()></div><button class="btn btn-primary btn" onclick=addNewPackage()><i class="fas fa-plus"></i> Add New Package</button></div></div><div class=package-grid id=packageGrid></div></div><div class=editor-panel id=editorPanel><div class=editor-content><div class=editor-header><h3 id=editorTitle>Edit Package</h3><button class=editor-close onclick=closeEditor()><i class="fas fa-times"></i></button></div><form class=form-grid id=editorForm><div class=form-group><label for=pkgName>Package Name *</label><input id=pkgName required></div><div class=form-group><label for=pkgVersion>Version *</label><input placeholder="e.g., 15.22.33130 (x64)" id=pkgVersion required></div><div class="form-group full-width"><label for=pkgDescription>Description</label><textarea id=pkgDescription rows=2></textarea></div><div class=form-group><label for=pkgHash>Package Hash (MD5)</label><div class=input-with-button><input placeholder="MD5 hash" id=pkgHash><button class="btn btn-sm" onclick=calculateHash() type=button><i class="fas fa-lock"></i> Calculate</button></div></div><div class=form-group><label>Package Image (Recommended Size: 256x256)</label><div onclick="document.getElementById('imageInput').click()" class=image-upload-area id=imageArea><img alt="Package image" id=imagePreview style=display:none><span class=placeholder id=imagePlaceholder><i class="fas fa-camera"></i> Click to add image</span><div class=image-actions id=imageActions style=display:none><button class="btn btn-sm" onclick=event.stopPropagation();updateImage() type=button><i class="fas fa-sync"></i> Update</button><button class="btn btn-sm" onclick=event.stopPropagation();downloadImage() type=button><i class="fas fa-download"></i> Download</button></div></div><input accept=image/png class=hidden-input id=imageInput onchange=handleImageUpload(event) type=file></div><div class=form-group><label for=pkgType>Package Type</label><select id=pkgType><option value=0>Compiler<option value=1>Godot Kits<option value=2>Library<option value=3>Sample Project<option value=4>Code Template<option value=5>Addon<option value=6>Tool</select></div><div class=form-group><label for=pkgPlatform>Platform</label><select id=pkgPlatform><option value=0>Windows (x64)<option value=1>Linux (x64)<option value=2>Windows (arm64)<option value=3>Linux (arm64)<option value=4>Android (arm64-v8a)<option value=5>iOS (arm64)<option value=6>MacOS (arm64)<option value=7>Universal</select></div><div class=form-group><label for=pkgSize>Package Size (bytes)</label><div class=input-with-button><input id=pkgSize placeholder=0 type=number><button class="btn btn-sm" onclick=calculateSize() type=button><i class="fas fa-calculator"></i> Calculate</button></div></div><div class=form-group><label for=pkgDate>Date</label><div class=input-with-button><input placeholder="MM/DD/YYYY HH:MM:SS AM/PM" id=pkgDate><button class="btn btn-sm" onclick=setCurrentDate() type=button><i class="fas fa-clock"></i> Now</button></div></div><div class=form-group><label for=pkgURL>Download URL ( <i class="fas fa-download"></i> 7z/jnvpkg )</label><input id=pkgURL placeholder=https://... type=url></div><div class=form-group><label for=pkgDestination>Destination Path</label><input id=pkgDestination placeholder=res://Jenova/Packages/MyPackage-1.0.0 value=res://Jenova/Packages></div><div class="form-group checkbox-group"><input id=pkgInstallScript type=checkbox><label for=pkgInstallScript>Has Install Script</label></div><div class="form-group checkbox-group"><input id=pkgUninstallScript type=checkbox><label for=pkgUninstallScript>Has Uninstall Script</label></div><div class="editor-actions full-width"><button class="btn btn-primary"><i class="fas fa-save"></i> Save Package</button><button class="btn btn-danger" onclick=deleteCurrentPackage() type=button><i class="fas fa-trash"></i> Delete</button><button class=btn onclick=closeEditor() type=button>Cancel</button></div></form></div></div></main></div><footer class=footer><span>Copyright © 2024-present MemarDesign™ LLC.</span><span><span style=opacity:.5>For Desktop Use Only / </span>Made with <i class="fas fa-heart" style=color:var(--accent-light)></i> by <a href=https://github.com/TheAenema>The Ænema</a></span></footer><div class=toast-container id=toastContainer></div><script src=data/md5.js></script><script src=data/app.js></script>
